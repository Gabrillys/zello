<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sapataria Zello — Gestão</title>

<!-- ===================================================================
     ÚNICA LINHA QUE VOCÊ PRECISA TROCAR:
     Cole abaixo o endereço /exec do sistema (Implantar > Gerenciar
     implantações > copiar a URL do app da Web). Se um dia esse endereço
     mudar, troque só aqui: o atalho instalado no celular continua o mesmo.
     =================================================================== -->
<script>
  var LINK_DO_SISTEMA = "https://script.google.com/macros/s/AKfycbxhTrrV7kBp56e1KJCvYu89AsNIjgwlxyi29oXbUXzvzUsGS5IPRYfJidcCcED3gvO_6Q/exec";
</script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" id="corDoSistema" content="#3d2718">
<link rel="icon" href="favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="icone-180-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zello">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body{ height:100%; margin:0; background:#3d2718; overscroll-behavior:none; }
  body{ font-family:system-ui, -apple-system, 'Segoe UI', sans-serif; }
  #quadro{
    position:fixed; inset:0; width:100%; height:100%; border:0; display:block;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    box-sizing:border-box; background:#efe6d3;
  }
  #abertura{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; background:#3d2718; color:#f2e9d8; text-align:center;
    padding:24px; transition:opacity .35s, background .35s; z-index:2;
  }
  #abertura.sumindo{ opacity:0; pointer-events:none; }
  #abertura img{ width:120px; height:120px; border-radius:24px; }
  #abertura .nome{ font-size:17px; font-weight:600; letter-spacing:.02em; }
  #abertura .aviso{ font-size:13.5px; color:#cbb98f; max-width:300px; line-height:1.5; }
  #abertura a{ color:#f2e9d8; font-weight:600; }
  .pontos::after{ content:"…"; animation:pontos 1.2s steps(4, end) infinite; }
  @keyframes pontos{ 0%{ content:"" } 25%{ content:"." } 50%{ content:".." } 75%{ content:"..." } }
</style>
</head>
<body>

<iframe id="quadro" title="Sistema de gestão" allow="clipboard-write; clipboard-read; fullscreen"></iframe>

<div id="abertura">
  <img src="icone-192.png" alt="">
  <div class="nome">SAPATARIA ZELLO</div>
  <div class="aviso"><span class="pontos">Abrindo o sistema</span></div>
  <div class="aviso" id="demorou" hidden>
    Está demorando mais que o normal. Confira a internet ou
    <a id="linkDireto" href="#" target="_blank" rel="noopener">abra o sistema no navegador</a>.
  </div>
</div>

<script>
  document.getElementById("linkDireto").href = LINK_DO_SISTEMA;
  var quadro = document.getElementById("quadro");
  var abertura = document.getElementById("abertura");
  quadro.addEventListener("load", function(){
    abertura.classList.add("sumindo");
    setTimeout(function(){ abertura.hidden = true; }, 400);
  });
  setTimeout(function(){
    if(!abertura.hidden) document.getElementById("demorou").hidden = false;
  }, 9000);
  quadro.src = LINK_DO_SISTEMA;

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  /* ===================================================================
     Tira do sistema acompanhando o tema escolhido dentro do app
     ===================================================================
     Esta página (index.html) e o sistema de verdade (dentro do <iframe>
     acima) são de ORIGENS DIFERENTES (github.io x script.google.com) - o
     navegador nunca deixa uma ler ou copiar o CSS/tema da outra
     diretamente, por segurança. A única ponte permitida entre as duas é
     postMessage: o sistema, sempre que aplica um tema (ao abrir e sempre
     que a pessoa troca a paleta em Empresa), manda uma mensagem pra cá
     avisando a cor atual - só a cor, nenhum dado de negócio.

     1) Assim que ela chega, pinta a tira do sistema (meta theme-color) e o
        fundo desta página/da splash na hora.
     2) Guarda essa cor no armazenamento deste site (github.io), separado
        de tudo o mais - assim, na PRÓXIMA vez que o app for aberto, a
        splash já nasce na cor certa, sem esperar a mensagem chegar de
        novo (é só isso que fica salvo aqui: uma cor).
     Se algo impedir a mensagem de chegar (app muito antigo, por exemplo),
     nada quebra - só continua na cor de fábrica (#3d2718) até a próxima
     mensagem, exatamente como já era antes desta atualização.
     =================================================================== */
  var CHAVE_COR_SALVA = "zelloCorTemaAtual";

  function aplicarCorDoSistema(cor){
    if(!cor) return;
    var meta = document.getElementById("corDoSistema");
    if(meta) meta.setAttribute("content", cor);
    document.documentElement.style.background = cor;
    document.body.style.background = cor;
    if(abertura) abertura.style.background = cor;
  }

  try{
    var corSalva = localStorage.getItem(CHAVE_COR_SALVA);
    if(corSalva) aplicarCorDoSistema(corSalva);
  }catch(err){}

  window.addEventListener("message", function(ev){
    if(!ev.data || ev.data.tipoMensagemZello !== "tema") return;
    var cor = ev.data.corPrincipal;
    if(!cor) return;
    aplicarCorDoSistema(cor);
    try{ localStorage.setItem(CHAVE_COR_SALVA, cor); }catch(err){}
  });
</script>
</body>
</html>
